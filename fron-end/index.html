<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 300px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-container input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-container button {
            width: 100%;
            padding: 10px;
            background: #659fd1;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-container button:hover {
            background: #67abbd;
        }

        .login-container .extra {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        .login-container .extra a {
            color: #4facfe;
            text-decoration: none;
        }
    </style>
</head>
<body>
    
<div class="login-container">
    <h2>Iniciar Sesión</h2>
    <form>
        <input type="text" placeholder="Usuario" required>
        <input type="password" placeholder="Contraseña" required>
        <input type="passwordR" placeholder="Repetir Contraseña" required>
        <button type="submit" id="mensaje">Entrar</button>
    </form>
    <div class="extra">
        <p><a href="#">¿Olvidaste tu contraseña?</a></p>
    </div>
</div>

</body>
</html>
